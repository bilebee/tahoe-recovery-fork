name: Tahoe 26.7.3 Recovery Image (BaseSystem)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      # Direct link from Apple's public sucatalog (product 142-54128 = Tahoe 26.7.3 / build 25G342)
      # Content-Length verified: 18388869343 bytes
      - name: Download InstallAssistant.pkg 26.7.3 from Apple
        run: |
          curl -L -o /tmp/InstallAssistant.pkg \
            https://swcdn.apple.com/content/downloads/02/21/142-54128-A_OWMUBNYT6S/xlorkwl2msc8dgn34ayr8dk2jm8xka68z3/InstallAssistant.pkg
          ls -l /tmp/InstallAssistant.pkg

      - name: Install the assistant
        run: |
          sudo installer -pkg /tmp/InstallAssistant.pkg -target /
          # Free ~18GB before creating the installer DMG
          rm -f /tmp/InstallAssistant.pkg

      - name: Run createinstallmedia and extract BaseSystem
        run: |
          INSTALLER=$(ls -d /Applications/Install*.app | head -n 1 || true)
          if [ ! -d "$INSTALLER" ]; then
            echo "Could not find Install macOS app in /Applications"
            ls -l /Applications
            exit 1
          fi
          SIZE_MB=$(du -sm "$INSTALLER" | cut -f1)
          EXTRA=$(echo "($SIZE_MB * 4 / 10 + 1)" | bc)
          TOTAL_MB=$(( SIZE_MB + EXTRA ))
          echo "Allocating ${TOTAL_MB} MB DMG"
          sudo hdiutil create -o /tmp/Tahoe -size ${TOTAL_MB}m -volname 'Tahoe' -layout SPUD -fs HFS+J
          sudo hdiutil attach /tmp/Tahoe.dmg -noverify -mountpoint /Volumes/Tahoe
          sleep 10
          sudo "$INSTALLER/Contents/Resources/createinstallmedia" --volume /Volumes/Tahoe --nointeraction
          INSTALL_VOL=$(ls -d /Volumes/Install* | head -n 1 || true)
          if [ ! -d "$INSTALL_VOL/BaseSystem" ]; then
            echo "No BaseSystem folder on $INSTALL_VOL"
            ls -la "$INSTALL_VOL"
            exit 1
          fi
          echo "Extracting BaseSystem from $INSTALL_VOL"
          cp -R "$INSTALL_VOL/BaseSystem" /tmp/BaseSystem
          ls -la /tmp/BaseSystem
          stat -f '%z bytes  %N' /tmp/BaseSystem/*

      - name: Upload com.apple.recovery.boot (BaseSystem.dmg + chunklist)
        uses: actions/upload-artifact@v4
        with:
          name: com.apple.recovery.boot
          path: /tmp/BaseSystem/*
          compression-level: 9
